<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip &amp; Bill Splitter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-card">
    <section class="panel panel-inputs">
      <div class="input-group">
        <label for="bill">Bill Amount</label>
        <div class="input-wrapper">
          <span class="currency">$</span>
          <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
        </div>
      </div>

      <div class="input-group">
        <label>Select Tip %</label>
        <div class="tip-grid">
          <button type="button" class="tip-btn" data-tip="5">5%</button>
          <button type="button" class="tip-btn active" data-tip="10">10%</button>
          <button type="button" class="tip-btn" data-tip="15">15%</button>
          <button type="button" class="tip-btn" data-tip="20">20%</button>
          <input type="number" id="customTip" placeholder="Custom" min="0" max="100">
        </div>
      </div>

      <div class="input-group">
        <div class="label-row">
          <label for="people">Number of People</label>
          <span class="error-msg" id="peopleError">Can't be zero</span>
        </div>
        <div class="stepper">
          <button type="button" class="step-btn" id="decPeople">&minus;</button>
          <input type="number" id="people" value="1" min="1">
          <button type="button" class="step-btn" id="incPeople">&plus;</button>
        </div>
      </div>
    </section>

    <section class="panel panel-results">
      <div class="result-row">
        <div>
          <h3>Tip Amount</h3>
          <span>/ person</span>
        </div>
        <div class="amount" id="tipPerPerson">$0.00</div>
      </div>

      <div class="result-row">
        <div>
          <h3>Total</h3>
          <span>/ person</span>
        </div>
        <div class="amount total" id="totalPerPerson">$0.00</div>
      </div>

      <button type="button" class="reset-btn" id="resetBtn">RESET</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
